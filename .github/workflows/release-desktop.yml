name: Release desktop app

on:
  push:
    branches:
      - main
  workflow_dispatch:

# electron-builder creates the GitHub release and uploads the installer,
# blockmap and latest.yml that installed apps read.
permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Give this build a newer version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          npm version $version --no-git-tag-version
          "DESKTOP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Create the release tag
        shell: pwsh
        run: |
          $tag = "v$env:DESKTOP_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          if (git rev-parse -q --verify "refs/tags/$tag") {
            Write-Output "Tag $tag already exists."
          } else {
            git tag $tag
            git push origin $tag
          }

      - name: Build the update
        run: npm run desktop:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish the release and update files
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:DESKTOP_VERSION"
          $version = $env:DESKTOP_VERSION
          $assets = @(
            "release/Javelin-AI-IDE-Setup-$version.exe",
            "release/Javelin-AI-IDE-Setup-$version.exe.blockmap",
            "release/latest.yml"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { throw "Missing release asset: $asset" }
          }
          gh release view $tag --json isDraft 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Update asset upload failed.' }
            gh release edit $tag --draft=false --latest
          } else {
            gh release create $tag @assets --verify-tag --latest --title "Javelin AI IDE $version" --notes "Automated desktop release."
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed.' }