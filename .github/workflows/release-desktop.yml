name: Release desktop app

on:
  push:
    branches:
      - main
  workflow_dispatch:

# electron-builder creates the GitHub release and uploads the installer,
# blockmap and latest.yml that installed apps read.
permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Give this build a newer version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          npm version $version --no-git-tag-version
          "DESKTOP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Create the release tag
        shell: pwsh
        run: |
          $tag = "v$env:DESKTOP_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          if (git rev-parse -q --verify "refs/tags/$tag") {
            Write-Output "Tag $tag already exists."
          } else {
            git tag $tag
            git push origin $tag
          }

      - name: Build and publish the update
        run: npm run desktop:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'